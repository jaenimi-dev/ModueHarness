# AI Team Specification Template (AI 팀 명세 템플릿)
# 사용법: 이 파일을 config/agents.yaml 로 복사하여 사용하세요.
# 명령어 예: cp config/agents.example.yaml config/agents.yaml
# (참고: config/agents.yaml 파일은 .gitignore에 의해 깃허브에 커밋되지 않고 안전하게 보관됩니다)

version: "0.6.0"
name: "my-engineering-team"

# -------------------------------------------------------------
# 권한 설정 (permission_mode / skip_permissions)
# -------------------------------------------------------------
# 에이전트는 기본적으로 CLI 자체의 쓰기 확인을 끈 채 실행됩니다
# (Claude: --permission-mode auto, Antigravity: --dangerously-skip-permissions).
# 대화형 프롬프트 없이 자동 진행하기 위한 설정이지만, 그만큼 도구가 제공하는
# 안전장치도 함께 사라집니다. 에이전트가 배정된 프로젝트 폴더 밖에 파일을 쓴
# 사례가 있으므로, 신뢰할 수 없는 작업에는 아래 키로 조여서 쓰세요.
#
#   permission_mode: "plan"     # Claude 계열. acceptEdits / auto / bypassPermissions
#                               #              / manual / dontAsk / plan 중 선택
#   skip_permissions: false     # Antigravity 계열. --dangerously-skip-permissions 제거
#
# 키를 생략하면 기존 기본값이 그대로 적용됩니다.
# 주의: 확인을 요구하는 모드로 바꾸면 비대화형 실행이 응답을 기다리다 멈출 수 있습니다.

# -------------------------------------------------------------
# 예시 1: Claude Code 전담 팀 (기본 예시)
# -------------------------------------------------------------
agents:
  # 1. 아키텍트 / 기획자 (Claude Code)
  architect:
    adapter: "claude"
    command: "claude"
    args: ["--permission-mode", "auto"]  # 대화형 프롬프트 대기 없이 자동 승인
    model: "claude-3-7-sonnet-latest"    # 사용할 모델 (예: sonnet, opus, haiku, claude-3-7-sonnet-latest)
    effort: "high"                       # 생각/추론 노력 수준 (low, medium, high, xhigh, max)
    role: "System Architect & Technical Planner"
    system_instruction: "You design clean, modular, and maintainable software architecture specifications."

  # 2. 구현 엔지니어 (Claude Code)
  developer:
    adapter: "claude"
    command: "claude"
    args: ["--permission-mode", "auto"]
    model: "claude-3-7-sonnet-latest"
    effort: "medium"                     # 구현을 위한 적정 추론 수준
    role: "Core Implementation Engineer"
    system_instruction: "You write robust, production-ready code matching the architectural specifications."

  # 3. 품질 & 보안 리뷰어 (Claude Code)
  reviewer:
    adapter: "claude"
    command: "claude"
    args: ["--permission-mode", "auto"]
    model: "claude-3-7-sonnet-latest"
    effort: "high"                       # 심층 검증을 위한 높은 추론 노력
    role: "Quality & Security Reviewer"
    system_instruction: "You critically review code for edge cases, performance bottlenecks, and security vulnerabilities."

# -------------------------------------------------------------
# 예시 2: Google Antigravity (AGY) 전담 팀 (필요시 위 agents를 대체)
# -------------------------------------------------------------
# ⚠️ Antigravity 주의: 모델 ID 자체가 추론 수준을 접미사로 포함합니다
#    (gemini-3.8-flash-high / -medium / -low, gemini-3.1-pro-high / -low).
#    따라서 model 접미사와 effort 값이 어긋나면 agy CLI가 실행을 거부합니다:
#      error: invalid model selection (--model "gemini-3.8-flash-high" --effort "medium"):
#             --model gemini-3.8-flash-high conflicts with --effort=medium
#    둘을 일치시키거나(권장), effort를 아예 생략해 모델 접미사에 맡기세요.
