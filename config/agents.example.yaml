# -------------------------------------------------------------
# 예시 4: OpenRouter 팀 (외부 CLI 없이 하네스가 직접 API 호출)
# -------------------------------------------------------------
# 준비: pip install 'modue-harness[openrouter]' 후 .env 에 OPENROUTER_API_KEY 설정
#
# tools (도구 권한, 기본값 read):
#   none  도구 없음 (순수 텍스트 응답: 토론, 요약)
#   read  list_dir / read_file / search (기획, 리뷰)
#   full  read + write_file / edit_file / run_command (개발)
# 모든 파일 접근은 배정된 프로젝트 폴더 안으로 제한되고, .git 안에는 쓸 수 없습니다.
#
# run_command 는 허용 목록 방식입니다. 기본 허용: pytest, python -m pytest/unittest/py_compile,
# git status/diff/log/show, ls, pwd. 셸을 거치지 않으므로 파이프(|), 리다이렉트(>), && 는 쓸 수 없습니다.
# allowed_commands 를 지정하면 기본 목록을 대체합니다 (빈 목록 [] 이면 run_command 비활성화).
# 주의: "python", "npm run" 처럼 임의 코드를 실행하는 명령을 넣으면 폴더 제한이 무의미해질 수 있습니다.
#
# 모델은 도구 호출(tool calling)을 지원해야 합니다: https://openrouter.ai/models?supported_parameters=tools
# agents:
#   architect:
#     adapter: "openrouter"
#     model: "anthropic/claude-sonnet-4.5"
#     effort: "high"                     # OpenRouter reasoning effort (지원 모델만 적용)
#     tools: "read"
#     role: "System Architect"
#     system_instruction: "You design modular software architecture."
#   developer:
#     adapter: "openrouter"
#     model: "qwen/qwen3-coder"
#     tools: "full"
#     max_turns: 60                      # 도구 호출 반복 최대 횟수 (기본 40)
#     allowed_commands: ["pytest", "python -m pytest", "git status", "git diff", "ls"]
#     command_timeout: 180               # run_command 1회 제한 시간(초, 기본 120)
#     role: "Software Engineer"
#   reviewer:
#     adapter: "openrouter"
#     model: "openai/gpt-5"
#     tools: "read"
#     role: "Code Reviewer"
#   # 같은 어댑터로 다른 OpenAI 호환 API 사용 (예: 로컬 Ollama)
#   local:
#     adapter: "openrouter"
#     model: "qwen2.5-coder:14b"
#     base_url: "http://localhost:11434/v1"
#     api_key_env: "OLLAMA_API_KEY"      # 아무 값이나 들어 있으면 됩니다
#     tools: "read"
